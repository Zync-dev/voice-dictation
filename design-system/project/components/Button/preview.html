<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">
<style>

</style>
</head>
<body class="mm-preview">
<div class="mm-pad mm-stack">
  <div class="mm-row">
    <button type="button" class="mm-btn mm-btn-primary">Start dictating</button>
    <button type="button" class="mm-btn">Add a word</button>
    <button type="button" class="mm-btn mm-btn-ghost">Copy</button>
    <button type="button" class="mm-btn mm-btn-danger">Clear history</button>
    <button type="button" class="mm-btn" disabled>Saving</button>
  </div>
  <div class="mm-row">
    <button type="button" class="mm-btn mm-btn-primary mm-btn-sm">Download model</button>
    <button type="button" class="mm-btn mm-btn-sm">Change hotkey</button>
    <button type="button" class="mm-btn mm-btn-ghost mm-btn-sm">Copy</button>
  </div>
</div>
</body>
</html>
