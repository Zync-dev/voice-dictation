<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Murmur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .voice { fill: var(--voice); }
  .ink { fill: var(--ink); }
  .cut { fill: var(--ground); }
  .script { fill: var(--script); }
  .command { fill: var(--command); }
  .think { fill: var(--think); }
  .soft { fill: var(--line-strong); }
  .blk { rx: var(--radius-lg); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 112px; line-height: 0.9; font-weight: 700; letter-spacing: -0.045em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      visible sizes: voice 128x264 bled off the top (the brand, largest) · ink 176x208 (the surface text lives on) · script 128x128 bled off the top right (text landed) · command 56x56 and think 56x56 bled off the right (states, small) — about a third of 960x288
        arrangement one tall voice slab, the ink slab beside it carrying the mark, state tiles stacked at the right edge; space-4 gutters, bottoms space-6 above the edge
        pattern     the literal motif: the mark's four sound bars and caret cut into the ink slab (bars in ground, caret in voice), and a short run of level bars on the ground under the script block — "the mark is the meter is the cursor"
        scales      block corners radius-lg; bar width space-4, bar gap space-3, bar ends half the width (space-2); level bars space-2 wide at a space-4 pitch; gutters space-4
      -->
      <rect class="voice blk" x="16" y="-16" width="128" height="280" rx="16"/>
      <rect class="ink blk" x="160" y="56" width="176" height="208" rx="16"/>
      <rect class="script blk" x="352" y="-16" width="144" height="144" rx="16"/>
      <rect class="command blk" x="352" y="144" width="56" height="56" rx="16"/>
      <rect class="think blk" x="424" y="144" width="72" height="56" rx="16"/>

      <!-- the mark, cut into the ink slab: four sound bars and the caret -->
      <rect class="cut" x="184" y="126" width="16" height="114" rx="8"/>
      <rect class="cut" x="212" y="165" width="16" height="75" rx="8"/>
      <rect class="cut" x="240" y="198" width="16" height="42" rx="8"/>
      <rect class="cut" x="268" y="165" width="16" height="75" rx="8"/>
      <rect class="voice" x="296" y="96" width="16" height="150" rx="8"/>

      <!-- level bars on the ground -->
      <rect class="soft" x="352" y="240" width="8" height="24" rx="4"/>
      <rect class="soft" x="368" y="228" width="8" height="36" rx="4"/>
      <rect class="soft" x="384" y="244" width="8" height="20" rx="4"/>
      <rect class="soft" x="400" y="220" width="8" height="44" rx="4"/>
      <rect class="soft" x="416" y="236" width="8" height="28" rx="4"/>
      <rect class="soft" x="432" y="224" width="8" height="40" rx="4"/>
      <rect class="soft" x="448" y="246" width="8" height="18" rx="4"/>
      <rect class="voice" x="464" y="216" width="8" height="48" rx="4"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Murmur</h1>
    <p class="tag">Speak. It types. The design system for the Windows dictation app.</p>
  </div>
</div>
</body>
</html>
