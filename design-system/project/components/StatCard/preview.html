<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stat card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-4);align-items:stretch}
</style>
</head>
<body class="mm-preview">
<div class="mm-pad grid">
  <div class="mm-stat mm-stat-lead">
    <span class="mm-stat-value">12,480</span>
    <span class="mm-stat-label">words dictated</span>
    <span class="mm-spark" aria-hidden="true"><i style="height:6px"></i><i style="height:10px"></i><i style="height:8px"></i><i style="height:14px"></i><i style="height:11px"></i><i style="height:17px"></i><i style="height:20px"></i></span>
  </div>
  <div class="mm-stat"><span class="mm-stat-value">142<small>wpm</small></span><span class="mm-stat-label">speaking speed</span></div>
  <div class="mm-stat"><span class="mm-stat-value">318</span><span class="mm-stat-label">dictations</span></div>
  <div class="mm-stat"><span class="mm-stat-value">3.6<small>h</small></span><span class="mm-stat-label">saved against typing at 40 wpm</span></div>
</div>
</body>
</html>
